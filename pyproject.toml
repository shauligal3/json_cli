[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsoncli"
version = "2.0.0"
description = "An interactive, schema-aware shell for editing JSON configuration files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shauli Gal" }]
dependencies = []
keywords = ["json", "cli", "config", "editor", "schema", "repl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
jsoncli = "jsoncli.cli:main"

[project.urls]
Repository = "https://github.com/shauligal3/json_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jsoncli = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "D",            # pydocstyle
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
    "SIM",          # simplify
    "RET",          # return statements
    "ARG",          # unused arguments
    "PT",           # pytest style
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR2004",  # magic values
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Shell command docstrings double as the interactive help text, so their
# first line is a usage synopsis rather than a sentence.
"src/jsoncli/shell.py" = ["D205", "D400", "D403", "D415"]
"tests/*" = ["D", "ARG", "SIM905"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["jsoncli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
